name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android

      - name: App icon and landscape screen
        run: |
          cp -r android-res/. android/app/src/main/res/
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape android/app/src/main/AndroidManifest.xml
          cp android-src/MainActivity.java android/app/src/main/java/app/cornershop/english/MainActivity.java

      - name: Copy game into the app
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Corner-Shop.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Corner-Shop-apk
          path: Corner-Shop.apk

      # Public download link: https://github.com/<owner>/corner-shop/releases/download/apk-latest/Corner-Shop.apk
      - name: Publish APK as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest Corner-Shop.apk --title "Corner Shop APK" --notes "Debug APK built from ${{ github.sha }}" --latest
